[project]
name = "locky-backend"
version = "0.1.0"
description = "Backend do Locky - gestão de reservas de armários de academia"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "bcrypt>=4.1",
    "email-validator>=2.2",
    "apscheduler>=3.11",
    "tzdata>=2024.1",
]

# Deploy no Vercel (projeto com Root Directory = backend)
[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-branch"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/main.py",
    "app/core/config.py",
    "app/core/db.py",
    "app/core/scheduler.py",
    "alembic/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
